<!doctype html>
<html lang="fr">
<base href="/app/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXIOR — Meta OS (démo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23222428'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Inter,system-ui,sans-serif' font-size='32' font-weight='650' fill='%23f4f4f5'%3EE%3C/text%3E%3C/svg%3E">
<script>
(function(){
  var k="exior_theme";
  function read(){try{return localStorage.getItem(k)}catch(e){return null}}
  function sys(){return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
  function apply(t){document.documentElement.setAttribute("data-theme", t==="light"?"light":"dark")}
  var s=read();
  apply(s==="dark"||s==="light"?s:sys());
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(e){
    var cur=read();
    if(cur!=="dark"&&cur!=="light") apply(e.matches?"dark":"light");
  });
})();
</script>
<style>
@font-face{
  font-family:Inter;
  src:url("fonts/Inter-latin.woff2") format("woff2");
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#f4f4f5; --bg-elev:#f7f7f8; --surface:#ffffff; --surface-2:#f3f3f5;
  --hover:rgba(20,20,22,.045); --line:#e4e4e7; --line-strong:#d4d4d8;
  --text:#1a1a1e; --muted:#52525b; --faint:#6b6b75;
  --accent:#5b45c6; --accent-hover:#4c399f; --accent-press:#3f2f88; --accent-ink:#ffffff;
  --accent-mark:#5b45c6; --accent-ring:rgba(91,69,198,.35);
  --ok:#0f7a4d; --warn:#8a5a10; --bad:#b42318;
  --shadow:0 16px 40px rgba(20,20,22,.12); --scrim:rgba(20,20,22,.4);
  --scrollbar:#c8c8ce; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --bg-elev:#19191c; --surface:#1c1c1f; --surface-2:#26262a;
    --hover:rgba(255,255,255,.05); --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
    --text:#ececef; --muted:#a1a1aa; --faint:#8d8d96;
    --accent:#5b45c6; --accent-hover:#4c399f; --accent-press:#3f2f88; --accent-ink:#ffffff;
    --accent-mark:#c9c0f6; --accent-ring:rgba(201,192,246,.55);
    --ok:#5dcaa0; --warn:#e0b15a; --bad:#f08a84;
    --shadow:0 18px 48px rgba(0,0,0,.45); --scrim:rgba(8,8,10,.62);
    --scrollbar:#3a3a40; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --bg-elev:#19191c; --surface:#1c1c1f; --surface-2:#26262a;
  --hover:rgba(255,255,255,.05); --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --text:#ececef; --muted:#a1a1aa; --faint:#8d8d96;
  --accent:#5b45c6; --accent-hover:#4c399f; --accent-press:#3f2f88; --accent-ink:#ffffff;
  --accent-mark:#c9c0f6; --accent-ring:rgba(201,192,246,.55);
  --ok:#5dcaa0; --warn:#e0b15a; --bad:#f08a84;
  --shadow:0 18px 48px rgba(0,0,0,.45); --scrim:rgba(8,8,10,.62);
  --scrollbar:#3a3a40; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f4f5; --bg-elev:#f7f7f8; --surface:#ffffff; --surface-2:#f3f3f5;
  --hover:rgba(20,20,22,.045); --line:#e4e4e7; --line-strong:#d4d4d8;
  --text:#1a1a1e; --muted:#52525b; --faint:#6b6b75;
  --accent:#5b45c6; --accent-hover:#4c399f; --accent-press:#3f2f88; --accent-ink:#ffffff;
  --accent-mark:#5b45c6; --accent-ring:rgba(91,69,198,.35);
  --ok:#0f7a4d; --warn:#8a5a10; --bad:#b42318;
  --shadow:0 16px 40px rgba(20,20,22,.12); --scrim:rgba(20,20,22,.4);
  --scrollbar:#c8c8ce; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:13px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:color-mix(in srgb, var(--text) 16%, transparent); color:var(--text)}
*{scrollbar-width:thin; scrollbar-color:var(--scrollbar) transparent}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-mark); outline-offset:2px}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
.skip{position:absolute; left:8px; top:-40px; background:var(--surface); border:1px solid var(--line-strong); padding:6px 10px; border-radius:6px; z-index:50}
.skip:focus{top:8px}
.i{width:16px; height:16px; flex:none}
.app{display:flex; min-height:100vh}
.side{
  width:232px; flex:none; display:flex; flex-direction:column;
  background:var(--bg-elev); border-right:1px solid var(--line);
  padding:14px 10px 12px; position:sticky; top:0; height:100vh; overflow:auto;
}
.brand{display:flex; align-items:center; gap:8px; padding:2px 8px 12px}
.mark{width:22px; height:22px; border-radius:6px; background:var(--text); color:var(--bg-elev); display:grid; place-items:center; font-weight:650; font-size:12px}
.brand-name{font-weight:650; font-size:13px; letter-spacing:.04em}
.brand-name small{display:block; font-weight:500; letter-spacing:0; color:var(--faint); font-size:11px}
.cmd-launch{
  display:flex; align-items:center; gap:8px; width:100%; height:32px; margin:0 0 10px; padding:0 8px;
  border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--faint); text-align:left;
}
.cmd-launch span{flex:1}
.cmd-launch:hover{color:var(--text); border-color:var(--line-strong)}
.navs{display:flex; flex-direction:column; gap:1px}
.nav{
  position:relative; display:flex; align-items:center; gap:8px; width:100%; height:30px; padding:0 8px;
  border:0; border-radius:6px; background:transparent; color:var(--muted); font-size:13px; font-weight:500; text-align:left;
}
.nav-l{flex:1}
.nav:hover{background:var(--hover); color:var(--text)}
.nav.on{background:var(--hover); color:var(--text)}
.nav.on::before{content:""; position:absolute; left:0; top:7px; bottom:7px; width:2px; border-radius:2px; background:var(--accent-mark)}
.nav kbd{opacity:.75}
.cnt{
  min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--surface-2);
  border:1px solid var(--line); color:var(--text); font-size:11px; display:inline-flex; align-items:center; justify-content:center;
}
kbd{
  font:11px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;
  border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:4px;
  padding:0 4px; color:var(--muted); background:var(--surface);
}
.side-foot{margin-top:auto; padding:10px 8px 2px; border-top:1px solid var(--line); font-size:12px; color:var(--muted)}
.side-foot b{color:var(--text); font-weight:600}
.backdrop{display:none}
.workspace{flex:1; min-width:0}
.top{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; height:52px; padding:0 20px;
  background:var(--bg); border-bottom:1px solid var(--line);
}
.crumb{min-width:0; display:flex; align-items:baseline; gap:8px}
.crumb h1{margin:0; font-size:14px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw}
.crumb .viewname{color:var(--muted); white-space:nowrap}
.sp{flex:1}
.usage{width:140px}
.usage small{display:block; color:var(--faint); font-size:11px; margin-bottom:4px}
.seg{display:flex; padding:2px; border:1px solid var(--line); border-radius:7px; background:var(--surface)}
.seg button{height:24px; padding:0 8px; border:0; border-radius:5px; background:transparent; color:var(--muted); font-size:12px; font-weight:550}
.seg button[aria-pressed="true"]{background:var(--text); color:var(--bg)}
.burger{display:none}
.iconbtn{
  width:30px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center;
  border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--text);
}
.iconbtn:hover{background:var(--hover)}
.view{padding:20px 24px 72px}
.pagehead{margin:0 0 14px}
.pagehead h2{margin:0; font-size:20px; font-weight:600; letter-spacing:-.02em}
.pagehead p{margin:4px 0 0; color:var(--muted); max-width:68ch}
.stack{display:flex; flex-direction:column; gap:12px}
.split{display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:12px}
.cols-2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.cols-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.panel.flush{padding:0; overflow:hidden}
.panel-h{display:flex; align-items:center; gap:8px; margin:0 0 8px}
.panel.flush .panel-h{padding:12px 14px 0}
.panel-h h3{margin:0; font-size:13px; font-weight:600; letter-spacing:-.01em}
.lead{margin:0 0 4px; color:var(--muted)}
.metrics{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:1px; background:var(--line); padding:0}
.metric{background:var(--surface); padding:12px 14px 13px; min-width:0}
.metric .k{font-size:12px; color:var(--muted); margin:0 0 4px}
.metric .n{font-size:18px; font-weight:600; letter-spacing:-.03em}
.metric .s{font-size:12px; color:var(--faint); margin-top:4px}
.nba-list{list-style:none; margin:0; padding:0}
.nba-row{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:start; padding:12px 0; border-top:1px solid var(--line)}
.nba-row:first-child{border-top:0; padding-top:2px}
.rank{width:22px; height:22px; display:grid; place-items:center; color:var(--muted); font-size:12px; font-weight:600}
.nba-title{font-weight:600; letter-spacing:-.01em}
.nba-why{margin:3px 0 0; color:var(--muted); font-size:12.5px}
.nba-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.nba-actions{display:flex; gap:6px}
.val{font-size:12px; color:var(--muted)}
.status{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:550; color:var(--muted); white-space:nowrap}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)}
.dot{width:6px; height:6px; border-radius:50%; background:currentColor}
.chips{display:flex; flex-wrap:wrap; gap:4px}
.chip{font-size:11.5px; padding:2px 6px; border-radius:5px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; height:30px; padding:0 10px;
  border-radius:6px; border:1px solid transparent; background:var(--accent); color:var(--accent-ink);
  font-size:13px; font-weight:550; letter-spacing:-.01em;
  transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:var(--accent-hover)}
.btn:active{background:var(--accent-press)}
.btn.sm{height:26px; padding:0 8px; font-size:12px}
.btn.ghost{background:transparent; color:var(--text); border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:transparent; color:var(--bad); border-color:var(--line-strong)}
.btn.danger:hover{background:color-mix(in srgb, var(--bad) 12%, transparent)}
.btn.block{width:100%}
.chart{width:100%; height:auto; display:block; color:var(--faint)}
.chart .gridl{stroke:var(--line); stroke-width:1}
.chart .hist{fill:none; stroke:var(--text); stroke-width:1.75}
.chart .fore{fill:none; stroke:var(--text); stroke-width:1.75; stroke-dasharray:4 3; opacity:.65}
.chart .band{fill:var(--text); opacity:.08}
.chart .now{fill:var(--surface); stroke:var(--text); stroke-width:1.75}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; font-size:12px; color:var(--muted)}
.sw{display:inline-block; width:12px; height:3px; border-radius:2px; background:var(--text); margin-right:5px; vertical-align:middle}
.sw.dash{background:linear-gradient(90deg, var(--text) 0 4px, transparent 4px 7px); background-size:7px 3px; opacity:.65}
.sw.band{height:8px; opacity:.18; border-radius:2px}
.sw.soft{opacity:.35}
.sw.bad{background:var(--bad); opacity:1; height:8px}
.bar-row{margin:8px 0}
.bar-top{display:flex; justify-content:space-between; gap:8px; font-size:12px}
.track{height:4px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:5px}
.track i{display:block; height:100%; background:var(--text); opacity:.72}
.track.alt i{opacity:.35}
.track i.bad{background:var(--bad); opacity:1}
.pre{white-space:pre-wrap; margin:0; max-height:280px; overflow:auto; color:var(--muted); font:inherit}
.table-wrap{overflow:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
.num{text-align:right; white-space:nowrap}
.roster,.docs,.conns{list-style:none; margin:0; padding:0}
.roster li,.docrow,.conn{
  display:grid; gap:12px 16px; align-items:start; padding:12px 14px; border-top:1px solid var(--line);
}
.roster li:first-child,.docrow:first-child,.conn:first-child{border-top:0}
.roster li{grid-template-columns:minmax(220px,1.3fr) minmax(180px,1fr)}
.docrow{grid-template-columns:36px minmax(0,1fr) auto; align-items:center}
.conn{grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) auto; align-items:center}
.who{display:flex; gap:10px; min-width:0}
.av{
  width:28px; height:28px; border-radius:6px; display:grid; place-items:center; flex:none;
  background:var(--surface-2); border:1px solid var(--line); font-size:11px; font-weight:650;
}
.nm{font-weight:600}
.ms{color:var(--muted); margin-top:2px}
.ft{
  width:36px; height:36px; border-radius:6px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--surface-2); font-size:9px; font-weight:700; letter-spacing:.04em; color:var(--muted);
}
.act{display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:12px; align-items:start}
.act .ic{
  width:32px; height:32px; border-radius:8px; display:grid; place-items:center;
  background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
}
.act pre, pre.code{
  white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; margin:8px 0 0; color:var(--muted);
  font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.steps{display:flex; flex-direction:column}
.step{display:grid; grid-template-columns:10px minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); font-size:12.5px}
.step:first-child{border-top:0}
.step i{width:6px; height:6px; border-radius:50%; background:var(--faint); display:block}
.chat{display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:12px; align-items:stretch; min-height:calc(100vh - 160px)}
.thread{display:flex; flex-direction:column; min-height:0; min-width:0}
.msgs{flex:1; overflow:auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px 12px; min-height:240px}
.m{max-width:min(72%,640px); padding:10px 12px; border-radius:10px; border:1px solid var(--line); white-space:pre-wrap; line-height:1.55}
.m.u{align-self:flex-end; background:var(--surface-2)}
.m.a{align-self:flex-start; background:var(--surface)}
.meta{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px}
.sugg{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
.sugg button{
  background:transparent; border:1px solid var(--line); color:var(--text); border-radius:999px; padding:5px 10px; font-size:12px;
}
.sugg button:hover{background:var(--hover)}
.composer{
  display:flex; gap:8px; align-items:flex-end; border:1px solid var(--line-strong); border-radius:10px; padding:8px; background:var(--surface);
}
.composer:focus-within{border-color:var(--accent-mark); box-shadow:0 0 0 3px var(--accent-ring)}
.composer textarea{flex:1; border:0; background:transparent; resize:none; min-height:40px; outline:none; padding:6px 4px}
.checks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.checks li{display:flex; gap:8px; align-items:flex-start}
.checks .i{margin-top:2px; color:var(--muted)}
.plans{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.plan .price{font-size:26px; font-weight:600; letter-spacing:-.03em; margin:8px 0 4px}
.plan.is-current{box-shadow:inset 0 0 0 1px var(--text)}
.drop{
  display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; color:var(--muted);
  border:1px dashed var(--line-strong); border-radius:10px; padding:22px 16px; background:transparent; cursor:pointer;
}
.drop:hover{background:var(--hover); color:var(--text)}
.drop b{color:var(--text); font-weight:600}
.drop input{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.gate{min-height:100vh; display:grid; place-items:center; padding:24px}
.gate .panel{width:min(380px,100%)}
.gate h2{margin:12px 0 4px; font-size:18px; letter-spacing:-.02em}
.field{display:flex; flex-direction:column; gap:4px; margin-top:12px; font-size:12px; color:var(--muted)}
.field input, .composer textarea{caret-color:var(--accent-mark)}
.field input{
  height:34px; border-radius:6px; border:1px solid var(--line-strong); background:var(--bg); color:var(--text); padding:0 10px; font-size:14px;
}
.field input::placeholder, .composer textarea::placeholder, .pal-in input::placeholder{color:var(--faint)}
.toast{
  position:fixed; right:16px; bottom:16px; max-width:min(380px, calc(100vw - 32px));
  background:var(--surface); color:var(--text); border:1px solid var(--line-strong); border-radius:8px;
  box-shadow:var(--shadow); padding:10px 12px; display:none; z-index:40;
}
.pal,.modal{position:fixed; inset:0; display:none; place-items:start center; padding:14vh 12px 12px; background:var(--scrim); z-index:30}
.pal.on,.modal.on{display:grid}
.box{width:min(640px,100%); background:var(--surface); border:1px solid var(--line-strong); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.modal .box{width:min(480px,100%)}
.pal-in{display:flex; align-items:center; gap:8px; padding:0 14px; border-bottom:1px solid var(--line); color:var(--faint)}
.pal-in input{flex:1; height:48px; border:0; background:transparent; outline:none; font-size:15px; color:var(--text)}
.pal-g{padding:10px 14px 2px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint)}
.hit{
  width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center;
  padding:10px 14px; border:0; border-top:1px solid var(--line); background:transparent; text-align:left; color:inherit;
}
.hit:hover{background:var(--hover)}
.hit.on{background:var(--surface-2)}
.pal .box{display:flex; flex-direction:column; max-height:min(72vh,560px)}
#palhits{overflow:auto; min-height:0}
.pal-in:focus-within{box-shadow:inset 0 -2px 0 var(--accent-mark)}
.hit-t{display:flex; flex-direction:column; gap:2px; min-width:0}
.hit-t b{font-weight:600}
.hit-k{font-size:12px; color:var(--muted)}
.pal-foot,.help-body{display:flex; gap:14px; flex-wrap:wrap; padding:8px 14px; border-top:1px solid var(--line); color:var(--faint); font-size:12px}
.help-body{flex-direction:column; gap:8px; border-top:0; padding:4px 16px 16px; color:var(--text)}
.help-body div{display:flex; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding-top:8px}
.help-h{display:flex; align-items:center; justify-content:space-between; padding:12px 14px 8px}
.help-h h2{margin:0; font-size:14px}
.empty{margin:0; color:var(--muted)}
.metrics.m4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){
  .metrics,.metrics.m4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.chat,.plans{grid-template-columns:1fr}
}
@media (max-width:860px){
  .burger{display:inline-flex}

function histOf(d){
  if(Array.isArray(d._hist)&&d._hist.length) return d._hist;
  if(Array.isArray(d.historique_ventes)&&d.historique_ventes.length) return d.historique_ventes;
  const h=d.prevision_ventes&&d.prevision_ventes.historique;
  if(h&&typeof h==="object") return Object.values(h);
  return [];
}
function line(hist,prev,ic){
  hist=hist||[]; prev=prev||[]; ic=ic||[];
  if(hist.length<1||!prev.length) return '<p class="empty">Données insuffisantes</p>';
  const W=720,H=220,PL=46,PR=8,PT=12,PB=18;
  const all=[...hist,...prev,...ic.flat()];
  let mx=Math.max(...all), mn=Math.min(...all);
  if(!(mx>mn)){mx+=1; mn-=1}
  const pad=(mx-mn)*0.08; mx+=pad; mn=Math.max(0,mn-pad);
  const n=hist.length+prev.length;
  const x=i=>PL+(W-PL-PR)*i/Math.max(1,n-1);
  const y=v=>PT+(H-PT-PB)*(1-(v-mn)/(mx-mn));
  const hp=hist.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const o=hist.length-1;
  const pp=`M${x(o).toFixed(1)},${y(hist[o]).toFixed(1)} `+prev.map((v,i)=>`L${x(o+1+i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let band="";
  if(ic.length){
    const up=ic.map((v,i)=>`L${x(o+1+i).toFixed(1)},${y(v[1]).toFixed(1)}`).join(" ");
    const dn=[...ic].map((v,i)=>[i,v]).reverse().map(([i,v])=>`L${x(o+1+i).toFixed(1)},${y(v[0]).toFixed(1)}`).join(" ");
    band=`<path d="M${x(o).toFixed(1)},${y(hist[o]).toFixed(1)} ${up} ${dn} Z" class="band"/>`;
  }
  let g="";
  for(let k=0;k<4;k++){
    const v=mn+(mx-mn)*k/3, yy=y(v).toFixed(1);
    g+=`<line class="gridl" x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}"/><text x="${PL-6}" y="${Number(yy)+3}" text-anchor="end">${fmt(v/1000)}k</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Prévision des ventes">${g}${band}<path d="${hp}" class="hist"/><path d="${pp}" class="fore"/><circle class="now" cx="${x(o).toFixed(1)}" cy="${y(hist[o]).toFixed(1)}" r="3.5"/></svg>`;
}
function bars(items){
  const max=Math.max(...items.map(i=>Math.max(i.a||0,i.b||0)),1);
  return items.map(i=>`<div class="bar-row"><div class="bar-top"><span>${esc(i.l)}</span><span class="muted">${i.t}</span></div>
    <div class="track"><i class="${i.tone||""}" style="width:${Math.max(0,Math.min(100,100*(i.a||0)/max))}%"></i></div>
    ${i.b!=null?`<div class="track alt"><i style="width:${Math.max(0,Math.min(100,100*i.b/max))}%"></i></div>`:""}</div>`).join("");
}

async function nbaGo(id,ok){
  const r=await api(`/tenants/${S.t}/copilote/${id}/${ok?"activer":"plus-tard"}`,{method:"POST",body:"{}"});
  if(!ok){toast(r.message||"Bien, on verra plus tard."); await load(); return}
  if(r.statut==="redirection"&&r.url){location.href=r.url; return}
  if(r.statut==="ouvrir_import"||r.statut==="application_oauth_manquante"){toast(r.message||r.repli||"Ouvrez Connecteurs pour déposer un fichier."); go("connecteurs"); return}
  if(r.vue){toast(r.message||"C'est noté."); S.view=r.vue; await load(); return}
  toast(r.message||"C'est fait."); await load();
}
function openPal(){const el=$("#pal"); if(!el) return; el.classList.add("on"); PAL.i=0; const i=$("#palq"); if(i){i.value=""; filterPal(); i.focus()}}
function closePal(){$("#pal")?.classList.remove("on")}

function toggleNav(){document.getElementById("side")?.classList.toggle("open"); document.getElementById("back")?.classList.toggle("show")}
function closeNav(){document.getElementById("side")?.classList.remove("open"); document.getElementById("back")?.classList.remove("show")}
function setTheme(t){
  try{localStorage.setItem("exior_theme", t)}catch(e){}
  document.documentElement.setAttribute("data-theme", t==="light"?"light":"dark");
  syncTheme();
}
function syncTheme(){
  const t=document.documentElement.getAttribute("data-theme");
  const d=document.getElementById("th-dark"), l=document.getElementById("th-light");
  if(d) d.setAttribute("aria-pressed", t==="dark"?"true":"false");
  if(l) l.setAttribute("aria-pressed", t==="light"?"true":"false");
}
function palItems(){
  const q=($("#palq")?.value||"").toLowerCase().trim();
  const acts=((S.d||{}).copilote||{}).actions||[];
  const nav=NAV.map(([k,l])=>({kind:"nav", id:k, titre:"Aller à "+l, pourquoi:"Navigation", verbe:"Ouvrir"}));
  return [...acts, ...nav].filter(a=>!q||(a.titre+" "+(a.pourquoi||"")).toLowerCase().includes(q));
}
function filterPal(){
  const items=palItems();
  PAL.i=Math.min(PAL.i||0, Math.max(0, items.length-1));
  const box=$("#palhits"); if(!box) return;
  if(!items.length){box.innerHTML='<div class="hit muted">Aucune action.</div>'; return}
  let html="", last="";
  items.forEach((a,i)=>{
    const g=a.kind==="nav"?"Navigation":"Actions";
    if(g!==last){html+=`<div class="pal-g">${g}</div>`; last=g}
    html+=`<button type="button" class="hit ${i===PAL.i?"on":""}" onmouseenter="PAL.i=${i};markPal()" onclick="palRun(${i})"><span class="hit-t"><b>${esc(a.titre)}</b><span class="muted">${esc(a.pourquoi||"")}</span></span><span class="hit-k">${a.kind==="nav"?"Ouvrir":esc(a.verbe||"Activer")}</span></button>`;
  });
  box.innerHTML=html;
}
function markPal(){document.querySelectorAll("#palhits .hit").forEach((el,i)=>el.classList.toggle("on", i===PAL.i))}
function navPal(e){
  const n=palItems().length;
  if(e.key==="Escape"){e.preventDefault(); closePal()}
  else if(e.key==="ArrowDown"){e.preventDefault(); PAL.i=Math.min(n-1,(PAL.i||0)+1); filterPal()}
  else if(e.key==="ArrowUp"){e.preventDefault(); PAL.i=Math.max(0,(PAL.i||0)-1); filterPal()}
  else if(e.key==="Enter"){e.preventDefault(); palRun(PAL.i||0)}
}
async function palRun(i){const a=palItems()[i]; if(!a) return; closePal(); if(a.kind==="nav"){go(a.id); return} await nbaGo(a.id,true)}
const PAL={i:0};
let CHORD=null, CHORD_T=0;
addEventListener("keydown", e=>{
  const t=e.target;
  const typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault(); $("#pal")?.classList.contains("on")?closePal():openPal(); return}
  if(e.key==="Escape"){closePal(); closeHelp(); closeNav(); return}
  if(typing) return;
  if(e.key==="?"){e.preventDefault(); toggleHelp(); return}
  if(e.key==="["){e.preventDefault(); toggleNav(); return}
  if(e.shiftKey&&(e.key==="T"||e.key==="t")){e.preventDefault(); setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"); return}
  if(CHORD==="g"){const id=GO[(e.key||"").toLowerCase()]; CHORD=null; if(id){e.preventDefault(); go(id)} return}
  if((e.key==="g"||e.key==="G")&&!e.metaKey&&!e.ctrlKey&&!e.altKey){CHORD="g"; clearTimeout(CHORD_T); CHORD_T=setTimeout(()=>{CHORD=null},900)}
});

async function ask(t){
  const q=(t||($("#q")&&$("#q").value)||"").trim(); if(!q) return;
  const m=$("#msgs"); if(!m) return;
  m.insertAdjacentHTML("beforeend", `<div class="m u">${esc(q)}</div><div class="m a" id="pending">…</div>`);
  m.scrollTop=m.scrollHeight;
  if($("#q")) $("#q").value="";
  try{
    const r=await api(`/tenants/${S.t}/chat`,{method:"POST", body:JSON.stringify({message:q})});
    const pending=$("#pending");
    if(pending) pending.outerHTML=`<div class="m a">${esc(r.reponse)}<div class="meta">${chipOk(r.revue&&r.revue.ok)}<span class="chip">${esc(r.modele)}</span>${r.escalade?'<span class="chip">escalade</span>':""}${r.skill?'<span class="chip">skill appris</span>':""}${(r.outils||[]).map(o=>`<span class="chip">${esc(o)}</span>`).join("")}<span class="chip">${fmt((r.cout_usd||0)*0.92,4)} €</span></div></div>`;

  }catch(err){const p=$("#pending"); if(p) p.textContent="Erreur : "+err.message}
}
async function decide(id,ok){await api(`/tenants/${S.t}/actions/${id}`,{method:"POST", body:JSON.stringify({approuve:ok})}); toast(ok?"Validé — exécution déclenchée par le connecteur":"Refusé"); await load()}
async function dl(n){if(window.exiorDemoDl) return window.exiorDemoDl(n); const b=await api(`/tenants/${S.t}/documents/${encodeURIComponent(n)}`); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=n; a.click()}
async function up(f){
  if(window.exiorDemoUp) return window.exiorDemoUp(f);
  if(!f) return;
  const r=await fetch(`/tenants/${S.t}/fichiers?nom=${encodeURIComponent(f.name)}`,{method:"POST", headers:{"Authorization":"Bearer "+S.k}, body:await f.arrayBuffer()});
  const j=await r.json();
  toast(j.type?`${j.lignes} lignes importées comme ${j.type} — reconfiguration en cours`:"Fichier non reconnu : colonnes à associer");
  setTimeout(load,1500);
}
async function conn(c){
  if(window.exiorDemoConn) return window.exiorDemoConn(c);
  const r=await api(`/tenants/${S.t}/oauth/${c}/start`);
  if(r.url) location.href=r.url;
  else toast(r.statut==="application_oauth_manquante"?"Connexion OAuth bientôt disponible — l'import de fichiers fonctionne déjà":r.statut);
}
addEventListener("hashchange", ()=>{const v=location.hash.slice(2); if(V[v]&&v!==S.view){S.view=v; render()}});
if(!V[S.view]) S.view="tableau";
if(window.EXIOR_PAGES_DEMO){S.t="demo"; S.k="demo"; load()}
else if(S.t&&S.k) load();
else render();
</script>
</body>
</html>
