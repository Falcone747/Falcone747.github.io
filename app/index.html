<style>
:root{

}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(124,58,237,.22),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(139,92,246,.12),transparent 60%),var(--bg);
  color:var(--t);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--v3);text-decoration:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(17,10,34,.92),rgba(8,5,18,.92));padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.mark{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,#7c3aed,#c084fc,#6d28d9,#7c3aed);box-shadow:var(--glow);display:grid;place-items:center;font-weight:800}
.logo b{font-size:15px;letter-spacing:.14em}.logo small{display:block;color:var(--v3);font-size:11px;letter-spacing:.08em}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--t2);cursor:pointer;font-weight:500;transition:.15s;position:relative}
.nav:hover{background:rgba(139,92,246,.08);color:var(--t)}
.nav.on{background:linear-gradient(90deg,rgba(124,58,237,.28),rgba(124,58,237,.06));color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.nav.on:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--v2);box-shadow:0 0 12px var(--v2)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .cnt{margin-left:auto;background:var(--v);color:#fff;border-radius:20px;font-size:11px;padding:1px 8px;font-weight:700}
.side-foot{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(124,58,237,.06);font-size:12px;color:var(--t2)}
.side-foot b{color:#fff}
main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--line);background:rgba(6,3,13,.7);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.top .sub{color:var(--t3);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--v4);background:rgba(124,58,237,.1)}
.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.pill.warn{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.pill.bad{color:var(--bad);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.sp{flex:1}
.meter{width:170px}.meter .bar{height:6px;border-radius:6px;background:rgba(167,139,250,.14);overflow:hidden}.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--v3))}
.meter small{color:var(--t3);font-size:11px}
.view{padding:28px 32px 60px;max-width:1400px}
.grid{display:grid;gap:16px}.g6{grid-template-columns:repeat(6,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g22{grid-template-columns:1fr 1fr}
.card{background:linear-gradient(180deg,rgba(22,13,44,.85),rgba(14,8,28,.85));border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.card.hl{box-shadow:var(--glow);border-color:var(--line2)}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--t2);letter-spacing:.02em;display:flex;align-items:center;gap:8px}

.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .l{color:var(--t3);font-size:12px}.kpi .s{font-size:12px;color:var(--v3);margin-top:6px}
.kpi:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.25),transparent 70%)}
.sec-t{display:flex;align-items:end;gap:12px;margin:6px 0 16px}.sec-t h2{margin:0;font-size:22px;letter-spacing:-.02em}.sec-t p{margin:0;color:var(--t3)}
.muted{color:var(--t3)}.small{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:3px 9px;border-radius:8px;background:rgba(124,58,237,.12);border:1px solid var(--line);color:var(--v4);font-size:12px}
.chip.g{background:rgba(52,211,153,.08);color:#a7f3d0;border-color:rgba(52,211,153,.25)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--t3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid rgba(167,139,250,.08);vertical-align:top}tr:hover td{background:rgba(124,58,237,.05)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:9px 16px;font-weight:650;cursor:pointer;font-size:13px;color:#fff;background:linear-gradient(135deg,#7c3aed,#9f67ff);box-shadow:0 6px 22px -8px rgba(124,58,237,.9);transition:.15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--v4);box-shadow:none}.btn.sm{padding:6px 11px;font-size:12px}
.btn.okb{background:linear-gradient(135deg,#059669,#34d399)}.btn.no{background:transparent;border:1px solid rgba(248,113,113,.4);color:#fca5a5;box-shadow:none}
.chat{display:grid;grid-template-columns:1fr 300px;gap:16px;height:calc(100vh - 150px)}
.thread{display:flex;flex-direction:column;min-height:0}.msgs{flex:1;overflow:auto;padding:6px 4px 16px;display:flex;flex-direction:column;gap:14px}
.m{max-width:78%;padding:13px 16px;border-radius:16px;white-space:pre-wrap;line-height:1.55}
.m.u{align-self:flex-end;background:linear-gradient(135deg,#6d28d9,#8b5cf6);border-bottom-right-radius:4px;box-shadow:0 8px 26px -12px rgba(124,58,237,.9)}
.m.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.m .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:11px;color:var(--t3)}
.composer{display:flex;gap:10px;padding:12px;border:1px solid var(--line2);border-radius:16px;background:var(--panel);box-shadow:var(--glow)}
.composer textarea{flex:1;background:transparent;border:0;color:var(--t);font:inherit;resize:none;outline:none;min-height:44px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.sugg span{cursor:pointer;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--v4);font-size:12px;background:rgba(124,58,237,.07)}

.act{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:start}

.nba{margin:0 0 18px}.nba-row{display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid rgba(167,139,250,.1)}.nba-row:last-child{border-bottom:0}

.pal{display:none;position:fixed;inset:0;background:rgba(4,2,10,.72);backdrop-filter:blur(10px);z-index:20;place-items:start center;padding-top:12vh}
.pal.on{display:grid}
.pal .box{width:min(680px,92vw);background:linear-gradient(180deg,rgba(22,13,44,.98),rgba(14,8,28,.98));border:1px solid var(--line2);border-radius:18px;box-shadow:var(--glow);overflow:hidden}
.pal input{width:100%;padding:16px 18px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--t);font:inherit;outline:none}
.pal .hit{padding:12px 18px;display:grid;grid-template-columns:1fr auto;gap:10px;cursor:pointer;border-bottom:1px solid rgba(167,139,250,.08);align-items:start}

.hintk{font-size:11px;color:var(--t3);border:1px solid var(--line);border-radius:8px;padding:3px 8px;letter-spacing:.04em}

  .burger{display:inline-flex}
  .top{padding:14px 16px}.view{padding:18px 16px 80px}
  .g6,.g4,.g3,.g2,.g22,.chat{grid-template-columns:1fr}
  .meter{display:none}
}

function appliquer(){
  const e=etat(); const d=structuredClone(DEMO);
  if(e.actions){const map={}; e.actions.forEach(a=>map[a.id]=a.statut); d.actions=d.actions.map(a=>map[a.id]?{...a,statut:map[a.id]}:a)}

      if(v==="activee" && a.kind==="valider") return false;

async function api(p,o={}){
  const body=typeof o.body==="string" && o.body ? JSON.parse(o.body) : (o.body||{});
  const e=etat();
  if(p.endsWith("/dashboard") || p.endsWith("/copilote") && !p.includes("/activer") && !p.includes("/plus-tard")){
    const d=appliquer();
    if(p.endsWith("/copilote")) return d.copilote;
    return d;
  }
  const mCop=p.match(/\/copilote\/([^/]+)\/(activer|plus-tard)/);
  if(mCop){
    const [_,id,verb]=mCop;
    const d=appliquer();
    const a=(d.copilote.actions||[]).find(x=>x.id===id);
    e.decisions=e.decisions||{};
    if(verb==="plus-tard"){ e.decisions[id]="plus_tard"; sauver(e); return {id, statut:"plus_tard", message:"Très bien, je la remettrai plus bas et je vous proposerai autre chose."} }
    if(!a) return {statut:"inconnue", id};
    e.decisions[id]="activee";
    if(a.kind==="valider"){
      const aid=+(a.deblocage&&a.deblocage.action_id || a.cible);
      e.actions=e.actions||d.actions.map(x=>({id:x.id,statut:x.statut}));
      e.actions=e.actions.map(x=>x.id==aid?{...x,statut:"approuvee"}:x);
      if(!e.actions.some(x=>x.id==aid)) e.actions.push({id:aid,statut:"approuvee"});
      sauver(e);
      return {id, kind:a.kind, statut:"validee", action:aid, message:"Validé. Dans l'espace client, l'exécution passe par le connecteur — rien n'est envoyé automatiquement."};
    }
    if(a.kind==="connecter"||a.kind==="importer"){
      sauver(e);
      return {id, kind:a.kind, statut:"ouvrir_import", message:a.kind==="connecter"?"Démo : la connexion continue sera disponible dans l'espace client. En attendant, déposez un export — ça fonctionne déjà.":"Déposez un FEC, des factures ou un relevé (CSV, XLSX) : dans l'espace client, le jumeau se reconfigure."};
    }
    if(a.kind==="prioriser"){ sauver(e); return {id, statut:"priorisee", vue:"initiatives", message:"Initiative placée en tête de suivi."} }
    if(a.kind==="automatiser"){ e.routine=true; sauver(e); return {id, statut:"routine_activee", message:"Veille quotidienne activée dans cette démo. Aucun envoi automatique."} }
    if(a.kind==="activer_skill"){ sauver(e); return {id, statut:"skill_active", message:"Skill activé. Il sera rejoué dès la prochaine question correspondante."} }
    sauver(e); return {id, statut:"ok", message:"C'est noté."};
  }
  if(p.includes("/chat") && (o.method||"GET").toUpperCase()==="POST"){
    const r=matchQA(body.message||"");
    const d=appliquer();
    e.taches=(e.taches??d.usage.taches)+1;
    const conv=(e.conversations||d.conversations).concat([
      {tache:body.message, resultat:r.reponse, ok:1, modele:r.modele, skill:r.skill, cout:r.cout_usd, ts:Date.now()/1000, agent:"agent"}
    ]);
    e.conversations=conv.slice(-30);
    sauver(e);
    return {reponse:r.reponse, revue:r.revue, modele:r.modele, escalade:r.escalade, skill:r.skill, outils:r.outils||[], cout_usd:r.cout_usd};
  }
  if(/\/actions\/\d+/.test(p) && (o.method||"").toUpperCase()==="POST"){
    const aid=+(p.match(/\/actions\/(\d+)/)[1]);
    const d=appliquer();
    e.actions=e.actions||d.actions.map(x=>({id:x.id,statut:x.statut}));
    const st=body.approuve?"approuvee":"refusee";
    e.actions=e.actions.map(x=>x.id==aid?{...x,statut:st}:x);
    if(!e.actions.some(x=>x.id==aid)) e.actions.push({id:aid,statut:st});
    e.decisions=e.decisions||{};
    (d.copilote.actions||[]).forEach(a=>{ if(a.kind==="valider" && String(a.deblocage&&a.deblocage.action_id||a.cible)===String(aid)) e.decisions[a.id]="activee"; });
    sauver(e);
    return {action:aid, approuve:!!body.approuve};
  }
  throw new Error("inaccessible en démo");
}

  <div class="card"><h3>Comment je réponds</h3><div class="small muted" style="line-height:1.7">1. Je cherche d'abord un <b style="color:#fff">skill déjà appris</b>.<br>2. Je délègue à l'agent spécialisé.<br>3. Les <b style="color:#fff">moteurs calculent</b> (HiGHS, CP-SAT, bayésien, Monte Carlo, Holt-Winters).<br>4. Le <b style="color:#fff">réviseur</b> vérifie chaque chiffre.<br>5. Modèle économique par défaut, modèle fort seulement si le réviseur le demande.<br>6. Tout engagement reste un <b style="color:#fff">brouillon à valider</b>.</div>
  <h3 style="margin-top:18px">Ce mois-ci</h3><div class="small">${fmt(d.usage.taches)} tâches sur ${fmt(d.usage.incluses)} incluses</div></div></div>`},
initiatives(d){const sel=new Set(d.portefeuille.selection||[]);
 return `<div class="sec-t"><h2>Initiatives</h2><p>Générées depuis votre jumeau, valorisées et sélectionnées par optimisation (OR-Tools CP-SAT).</p></div>
 <div class="grid g4"><div class="card kpi hl"><div class="l">Valeur du portefeuille retenu</div><div class="v">${eur(d.portefeuille.valeur_totale)}<span class="small muted"> /an</span></div><div class="s">ajustée du risque · ${esc(d.portefeuille.statut||"")}</div></div>
 <div class="card kpi"><div class="l">Initiatives retenues</div><div class="v">${sel.size} / ${d.initiatives.length}</div><div class="s">budget et capacité respectés</div></div>
 <div class="card kpi"><div class="l">Connecteurs à ajouter</div><div class="v">${(d.architecture.connecteurs_a_ajouter||[]).length}</div><div class="s">${esc((d.architecture.connecteurs_a_ajouter||[]).join(", "))}</div></div>
 <div class="card kpi"><div class="l">Agents mobilisés</div><div class="v">${(d.architecture.agents_mobilises||[]).length}</div><div class="s">architecture cible</div></div></div>
 <div class="card" style="margin-top:16px"><table><tr><th>Initiative</th><th class="num">Gain brut/an</th><th class="num">Probabilité</th><th class="num">Risque</th><th class="num">Valeur ajustée</th><th>Agents</th><th></th></tr>
 ${d.initiatives.map(i=>`<tr><td><b>${esc(i.titre)}</b><div class="small muted">${esc(i.base_calcul)}</div></td><td class="num">${eur(i.gain_annuel_brut)}</td><td class="num">${pct(i.probabilite_succes)}</td><td class="num">${pct(i.risque)}</td><td class="num"><b>${eur(i.valeur_ajustee_risque)}</b></td><td><div class="chips">${i.agents.map(a=>`<span class="chip">${lab(a)}</span>`).join("")}</div></td><td>${sel.has(i.id)?'<span class="pill ok">Retenue</span>':'<span class="pill">En réserve</span>'}</td></tr>`).join("")}</table>
 <p class="small muted" style="margin-top:12px">${esc(d.hypotheses.note||"")}</p></div>`},
agents(d){return `<div class="sec-t"><h2>Vos agents</h2><p>Créés automatiquement pour votre secteur (${esc(d.genesis.famille)} · ${esc(d.genesis.methode_secteur)}), testés et attaqués avant activation.</p></div>
 <div class="grid g4">${d.agents.map(a=>{const on=a.statut=="actif";return `<div class="card agent ${on?"":""}"><div class="hd"><div class="av">${lab(a.id).slice(0,2).toUpperCase()}</div><div><div class="nm">${lab(a.id)}</div><span class="pill ${on?"ok":"warn"}"><span class="dot"></span>${on?"Actif":"Bloqué par la porte"}</span></div></div>
 <div class="ms">${esc(a.mission)}</div>
 <div class="chips">${(a.objets_lecture||[]).slice(0,4).map(o=>`<span class="chip">${o=="*"?"tout (orchestration)":o}</span>`).join("")}</div>
 <div class="small muted">${a.expertise?`Expertise vérifiée : <b style="color:#fff">${pct(a.expertise.taux_verification)}</b> · ${a.expertise.regles} règles citées${a.expertise.cache?" · bibliothèque":""}`:"Noyau du métasystème"}</div>
 <div class="small muted">${a.brouillons?"✎ brouillons à valider":"lecture seule"} · ${a.habilitation_pii?"données personnelles habilitées":"sans données personnelles"} · paiement : jamais</div></div>`}).join("")}</div>`},
validations(d){const P=d.actions.filter(a=>a.statut=="a_valider"),H=d.actions.filter(a=>a.statut!="a_valider");
 const icn={relance_impaye:"✉️",reallocation_budget_pub:"📊",brouillon_reappro:"📦",brouillon_reponse:"💬"};
 return `<div class="sec-t"><h2>Validations</h2><p>Rien d'engageant ne part sans vous. Un clic pour valider, un clic pour refuser.</p></div>
 ${P.map(a=>{const x=JSON.parse(a.apres||"{}");return `<div class="card" style="margin-bottom:12px"><div class="act"><div class="ic">${icn[a.action]||"⚡"}</div>
 <div><b>${esc(lab(a.action))}</b> <span class="muted">· ${esc(a.cible)}</span><div class="small muted">proposé par ${lab(a.acteur)} · ${new Date(a.ts*1000).toLocaleString("fr-FR")}</div>
 ${detail(a.action,x)}</div>
 <div style="display:flex;flex-direction:column;gap:8px"><button class="btn okb sm" onclick="decide(${a.id},true)">✓ Valider</button><button class="btn no sm" onclick="decide(${a.id},false)">Refuser</button></div></div></div>`}).join("")||'<div class="card"><p class="muted">Aucune validation en attente. 🎉</p></div>'}
 ${H.length?`<h3 class="muted" style="margin-top:22px">Historique</h3><div class="card"><table>${H.map(a=>`<tr><td>${esc(lab(a.action))}</td><td class="muted">${esc(a.cible)}</td><td><span class="pill ${a.statut=="approuvee"?"ok":"bad"}">${a.statut}</span></td></tr>`).join("")}</table></div>`:""}`},
documents(d){return `<div class="sec-t"><h2>Documents</h2><p>Produits par votre suite bureautique intégrée (Word, Excel avec formules, PowerPoint, PDF).</p></div>
 <div class="grid g3">${d.documents.map(f=>`<div class="card doc"><div class="ft ${f.type}">${f.type.toUpperCase()}</div><div style="flex:1"><b>${esc(f.nom)}</b><div class="small muted">${fmt(f.taille_ko,1)} Ko</div></div><button class="btn ghost sm" onclick="dl('${esc(f.nom)}')">Télécharger</button></div>`).join("")||'<p class="muted">Aucun document.</p>'}</div>`},
connecteurs(d){return `<div class="sec-t"><h2>Connecteurs</h2><p>Détectés depuis vos outils. Déposez vos exports pour démarrer tout de suite ; connectez vos comptes pour la synchronisation continue.</p></div>
 <div class="drop" onclick="document.getElementById('f').click()"><div style="font-size:28px">⇪</div><b>Déposez un FEC, des factures, des ventes (CSV, XLSX)</b><div class="small muted">Reconnu automatiquement et ajouté à votre jumeau — puis vos agents se reconfigurent.</div><input type="file" id="f" style="display:none" onchange="up(this.files[0])"></div>
 <div class="grid g3" style="margin-top:16px">${d.connecteurs.map(c=>`<div class="card"><h3 style="color:#fff;font-size:14px">${esc(lab(c.id))}<span class="pill ${c.connecte?"ok":""}">${c.connecte?"<span class='dot'></span>Actif":esc(c.auth)}</span></h3>
 <div class="small muted">${esc(c.categorie)}${c.serveur_mcp?" · serveur MCP : "+esc(c.serveur_mcp):""}</div>
 <div class="chips" style="margin:10px 0">${c.outils.map(o=>`<span class="chip">${esc(o)}</span>`).join("")}</div>
 ${c.connecte?"":`<button class="btn sm" onclick="conn('${c.id}')">Connecter</button>`}</div>`).join("")}</div>`},
metasysteme(d){const g=d.genesis;return `<div class="sec-t"><h2>Métasystème</h2><p>La couche de contrôle qui a créé, testé et activé vos agents — et qui continue de les faire progresser.</p></div>
 <div class="grid g4">${[["Onboarding complet",fmt(g.duree_totale_s,2)+" s",fmt(g.cout_total_usd*0.92,3)+" € de calcul IA"],["Politiques testées",esc(g.politiques?.tests),"refus par défaut, forbid prioritaire"],["Actions interdites forcées",esc(g.passerelle)+" bloquées","modèle supposé compromis"],["Red team",(g.red_team?.defenses_reussies??"—")+" / "+(g.red_team?.attaques??"—"),(g.red_team?.interdits_executes??0)+" action interdite exécutée"]]
  .map(([l,v,s])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("")}</div>
 <div class="grid g22" style="margin-top:16px"><div class="card"><h3>Genesis — étapes chronométrées</h3><div class="steps">${(g.etapes||[]).map(s=>`<div class="step"><i></i><span>${esc(s.etape)}</span><span class="muted">${fmt(s.duree_s,2)} s</span><span class="muted">${fmt(s.cout_usd*0.92,4)} €</span></div>`).join("")}</div></div>
 <div class="card hl"><h3>Volant d'inertie (bibliothèque partagée)</h3><p class="small muted">Chaque onboarding publie des modèles anonymisés (jamais de données client) : packs d'expertise, prompts, connecteurs, politiques, skills. L'entreprise suivante démarre plus vite et pour moins cher.</p>
 <div class="chips">${Object.entries(d.bibliotheque.elements||{}).map(([k,n])=>`<span class="chip">${k} · ${n}</span>`).join("")}</div>
 <div class="grid g22" style="margin-top:14px"><div class="kpi"><div class="l">Réutilisations</div><div class="v">${fmt(d.bibliotheque.reutilisations)}</div></div><div class="kpi"><div class="l">IA économisée</div><div class="v">${fmt(d.bibliotheque.economie_ia_usd*0.92,3)} €</div></div></div>
 <h3 style="margin-top:16px">Journal d'audit</h3><span class="pill ${d.audit.ok?"ok":"bad"}"><span class="dot"></span>${d.audit.ok?"Chaîne intègre":"Rupture détectée"} · ${fmt(d.audit.entrees)} entrées</span></div></div>`},
reglages(d){const cur=d.tenant.plan;return `<div class="sec-t"><h2>Réglages & offre</h2><p>Abonnement + usage. Aucun frais de mise en place.</p></div>
 <div class="grid g3">${Object.entries(d.plans).map(([k,p])=>`<div class="card plan ${k==cur?"cur":""}"><div class="pill">${k==cur?"Votre offre":"Offre"}</div><h3 style="justify-content:center;color:#fff;font-size:16px;margin-top:10px">${k[0].toUpperCase()+k.slice(1)}</h3><div class="p">${fmt(p.prix_mois_eur)} €<span class="small muted"> HT/mois</span></div><div class="muted small">${fmt(p.taches_incluses)} tâches incluses · 0 € de mise en place</div></div>`).join("")}</div>
 <div class="grid g22" style="margin-top:16px"><div class="card"><h3>Consommation du mois</h3><div class="kpi"><div class="v">${fmt(d.usage.taches)} <span class="small muted">/ ${fmt(d.usage.incluses)} tâches</span></div></div><div class="meter" style="width:100%;margin-top:10px"><div class="bar"><i style="width:${Math.min(100,100*d.usage.taches/d.usage.incluses)}%"></i></div></div><p class="small muted">Tâche supplémentaire : 0,90 € HT · supplément à ce jour : ${eur(d.usage.a_facturer_sup_eur)}</p></div>
 <div class="card"><h3>Sécurité</h3><div class="small" style="line-height:1.9">✓ Données, mémoire, coffre et journal isolés pour votre entreprise<br>✓ Secrets chiffrés, jamais visibles des agents<br>✓ Aucun paiement par un agent, jamais<br>✓ Envois et écritures uniquement après votre validation<br>✓ Journal d'audit chaîné et vérifiable</div></div></div>`}
};
function detail(t,x){
 if(x.corps)return `<pre>${x.objet?"Objet : "+esc(x.objet)+"\n\n":""}${esc(x.corps)}</pre>`;
 if(x.actuel&&x.propose)return `<table style="margin-top:10px;max-width:560px"><tr><th>Canal</th><th class="num">Actuel</th><th class="num">Proposé</th><th class="num">Écart</th></tr>${Object.keys(x.actuel).map(c=>`<tr><td>${esc(c.replace("_"," "))}</td><td class="num">${eur(x.actuel[c])}</td><td class="num"><b>${eur(x.propose[c])}</b></td><td class="num" style="color:${x.propose[c]>=x.actuel[c]?"var(--ok)":"var(--bad)"}">${x.propose[c]>=x.actuel[c]?"+":""}${eur(x.propose[c]-x.actuel[c])}</td></tr>`).join("")}</table><div class="small muted" style="margin-top:8px">Gain modélisé : <b style="color:#fff">+${eur(x.gain_estime)}</b> par période, à budget constant.</div>`;
 if(x.references)return `<div class="chips" style="margin-top:10px">${x.references.map(r=>`<span class="chip">${esc(r)}</span>`).join("")}</div>`;
 return `<pre>${esc(JSON.stringify(x,null,1))}</pre>`}

function nba(d){const L=(d.copilote&&d.copilote.actions)||[];if(!L.length)return "";
 const rows=L.slice(0,5).map((a,i)=>`<div class="nba-row"><div class="nba-n">${i+1}</div>
  <div><b>${esc(a.titre)}</b>${a.valeur_attendue_eur?`<span class="pill" style="margin-left:8px">${eurc(a.valeur_attendue_eur)}${a.kind==="valider"?"":" / an"}</span>`:""}${a.preuve_similaire?`<span class="chip" style="margin-left:6px">${a.preuve_similaire} entreprise${a.preuve_similaire>1?"s":""} similaire${a.preuve_similaire>1?"s":""}</span>`:""}
  <div class="small muted" style="margin-top:4px">${esc(a.pourquoi)}</div></div>
  <div style="display:flex;flex-direction:column;gap:6px;min-width:118px">
    <button class="btn sm" onclick="nbaGo('${a.id}',true)">${esc(a.verbe||"Activer")}</button>
    <button class="btn ghost sm" onclick="nbaGo('${a.id}',false)">Plus tard</button>
  </div></div>`).join("");
 return `<div class="card hl nba"><h3>Copilote d'activation <span class="pill ok"><span class="dot"></span>Sans appel IA</span></h3>
  <p class="small muted" style="margin:-4px 0 8px">${esc((d.copilote&&d.copilote.message)||"Voici ce que je ferais en premier.")}</p>${rows}</div>`}
async function nbaGo(id,ok){const r=await api(`/tenants/${S.t}/copilote/${id}/${ok?"activer":"plus-tard"}`,{method:"POST",body:"{}"});
 if(!ok){toast(r.message||"Bien, on verra plus tard.");await load();return}
 if(r.statut==="redirection"&&r.url){location.href=r.url;return}
 if(r.statut==="ouvrir_import"||r.statut==="application_oauth_manquante"){toast(r.message||r.repli||"Ouvrez Connecteurs pour déposer un fichier.");go("connecteurs");return}
 if(r.vue){toast(r.message||"C'est noté.");S.view=r.vue;await load();return}
 toast(r.message||"C'est fait.");await load()}
function openPal(){const el=$("#pal");el.classList.add("on");filterPal();const i=$("#palq");if(i){i.value="";i.focus()}PAL.i=0}
function closePal(){$("#pal")?.classList.remove("on")}
function palItems(){const q=($("#palq")?.value||"").toLowerCase().trim();const acts=((S.d||{}).copilote||{}).actions||[];
 const nav=NAV.map(([k,l])=>({kind:"nav",id:k,titre:"Aller à "+l,pourquoi:"Navigation",verbe:"Ouvrir"}));
 return [...acts,...nav].filter(a=>!q||(a.titre+" "+(a.pourquoi||"")).toLowerCase().includes(q))}
function filterPal(){const items=palItems();PAL.i=Math.min(PAL.i,Math.max(0,items.length-1));
 $("#palhits").innerHTML=items.map((a,i)=>`<div class="hit ${i===PAL.i?"on":""}" onmouseenter="PAL.i=${i}" onclick="palRun(${i})">
  <div><b>${esc(a.titre)}</b><div class="small muted">${esc(a.pourquoi||"")}</div></div>
  <div>${a.kind==="nav"?`<span class="hintk">↵</span>`:`<span class="btn sm">${esc(a.verbe||"Activer")}</span>`}</div></div>`).join("")||'<div class="hit muted">Aucune action.</div>'}
function navPal(e){const n=palItems().length;if(e.key==="Escape"){e.preventDefault();closePal()}
 else if(e.key==="ArrowDown"){e.preventDefault();PAL.i=Math.min(n-1,(PAL.i||0)+1);filterPal()}
 else if(e.key==="ArrowUp"){e.preventDefault();PAL.i=Math.max(0,(PAL.i||0)-1);filterPal()}
 else if(e.key==="Enter"){e.preventDefault();palRun(PAL.i||0)}}
async function palRun(i){const a=palItems()[i];if(!a)return;closePal();if(a.kind==="nav"){go(a.id);return}await nbaGo(a.id,true)}
const PAL={i:0};
addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#pal")?.classList.contains("on")?closePal():openPal()}});

function render(){ if(!S.t||!S.k){$("#root").innerHTML=`<div class="login card hl"><div class="mark" style="margin:0 auto 14px;width:48px;height:48px">E</div><h2>EXIOR Meta OS</h2><p class="muted">Connectez-vous à votre espace</p><input id="lt" placeholder="Identifiant entreprise"><input id="lk" type="password" placeholder="Jeton d'accès"><button class="btn" style="width:100%;justify-content:center;margin-top:8px" onclick="S.t=lt.value;S.k=lk.value;localStorage.setItem('exior_t',S.t);localStorage.setItem('exior_k',S.k);load()">Entrer</button></div>`;return}
 const d=S.d;if(!d)return; const pend=d.actions.filter(a=>a.statut=="a_valider").length,u=d.usage;
 $("#root").innerHTML=`<div class="app"><aside><div class="logo"><div class="mark">E</div><div><b>EXIOR</b><small>META OS</small></div></div>
 ${NAV.map(([k,l])=>`<div class="nav ${S.view==k?"on":""}" onclick="go('${k}')">${ico(k)}<span>${l}</span>${k=="validations"&&pend?`<span class="cnt">${pend}</span>`:""}</div>`).join("")}
 <div class="side-foot"><b>${d.agents.filter(a=>a.statut=="actif").length} agents actifs</b><br>${fmt(Object.values(d.jumeau).reduce((a,b)=>a+b,0))} objets dans le jumeau<br><span style="color:var(--v3)">Métasystème opérationnel</span><div class="small muted" style="margin-top:8px">Démo — entreprise fictive</div></div></aside>
 <main><div class="top"><button class="btn ghost sm burger" onclick="document.querySelector('aside').classList.toggle('open')" aria-label="Menu">☰</button><div><h1>${esc(d.tenant.raison_sociale)}</h1><div class="sub">${esc(NAV.find(n=>n[0]==S.view)[1])}</div></div><span class="pill ok"><span class="dot"></span>${d.tenant.statut=="actif"?"Actif":esc(d.tenant.statut)}</span><span class="pill">Offre ${esc(d.tenant.plan)}</span><div class="sp"></div>
 <div class="meter"><small>${fmt(u.taches)} / ${fmt(u.incluses)} tâches ce mois</small><div class="bar"><i style="width:${Math.min(100,100*u.taches/u.incluses)}%"></i></div></div><button class="btn ghost sm" onclick="openPal()" title="Palette de commandes">⌘K</button><button class="btn sm" onclick="go('conversation')">✦ Demander</button></div>
 <div class="view">${V[S.view](d)}</div></main></div>`;
 const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight}
function go(v){S.view=v;location.hash="#/"+v;render();document.querySelector('aside')?.classList.remove('open')}
async function load(){S.d=appliquer(); render(); if(Q.get("palette")==="1")openPal()}
async function ask(t){const q=t||$("#q").value.trim();if(!q)return;const m=$("#msgs");m.insertAdjacentHTML("beforeend",`<div class="m u">${esc(q)}</div><div class="m a" id="pending">…</div>`);m.scrollTop=m.scrollHeight;if($("#q"))$("#q").value="";
 try{const r=await api(`/tenants/${S.t}/chat`,{method:"POST",body:JSON.stringify({message:q})});$("#pending").outerHTML=`<div class="m a">${esc(r.reponse)}<div class="meta"><span class="chip ${r.revue.ok?"g":""}">${r.revue.ok?"✓ vérifié par le réviseur":"bloqué par le réviseur"}</span><span class="chip">${esc(r.modele)}</span>${r.escalade?'<span class="chip">escalade</span>':""}${r.skill?'<span class="chip">skill appris</span>':""}${r.outils.map(o=>`<span class="chip">${o}</span>`).join("")}<span>${fmt(r.cout_usd*0.92,4)} €</span></div></div>`;S.d.usage.taches++}catch(e){$("#pending").textContent="Erreur : "+e.message}}
async function decide(id,ok){await api(`/tenants/${S.t}/actions/${id}`,{method:"POST",body:JSON.stringify({approuve:ok})});toast(ok?"Validé — exécution déclenchée par le connecteur":"Refusé");await load()}
async function dl(n){const href=DOCS[n]||("docs/"+encodeURIComponent(n)); window.open(href, "_blank", "noopener")}
async function up(f){if(!f)return;toast("Démo : le fichier « "+f.name+" » serait reconnu et ajouté au jumeau. Dans l'espace client, les agents se reconfigurent ensuite.");}
async function conn(c){toast("Démo : la connexion continue à "+c.replace(/_/g," ")+" sera disponible dans l'espace client. En attendant, déposez un export — ça fonctionne déjà.")}
addEventListener("hashchange",()=>{const v=location.hash.slice(2);if(V[v]&&v!=S.view){S.view=v;render()}});
if(!V[S.view])S.view="tableau"; S.t="demo"; S.k="demo"; load();
</script>
